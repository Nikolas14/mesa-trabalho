<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Trabalho</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main>
    <h1>Mesa de Trabalho</h1>
    <noscript><p>Ative o JavaScript para usar a mesa.</p></noscript>

    <div class="campo-captura">
      <input id="captura" type="text" aria-label="Novo card" placeholder="Digite qualquer coisa e aperte Enter. Use / para escolher um círculo (Tab seleciona)" autocomplete="off">
      <ul id="sugestoes" hidden></ul>
    </div>

    <section class="gaveta sem-aba" aria-labelledby="mesa-titulo">
      <header class="gaveta-topo">
        <h2 id="mesa-titulo">Na mesa (ainda não organizados)</h2>
      </header>
      <div id="lista" data-circulo="mesa"></div>
    </section>

    <section id="circulos" aria-label="Círculos"></section>
  </main>

  <div id="menu-flutuante">
    <div id="opcoes" hidden>
      <button type="button" data-acao="novo">Novo círculo</button>
    </div>
    <button id="botao-mais" type="button" aria-label="Opções" aria-controls="opcoes" aria-expanded="false">+</button>
  </div>

  <div id="lixeira">
    <svg class="icone" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M3 6h18"/>
      <path d="M8 6V4h8v2"/>
      <path d="M19 6l-1 14H6L5 6"/>
      <path d="M10 11v6M14 11v6"/>
    </svg>
    <div>Arraste aqui para apagar</div>
  </div>

  <!-- Sortable precisa estar carregado antes dos scripts da aplicação. -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Scripts comuns (sem módulos) para funcionar abrindo o arquivo direto no navegador.
       Ordem: utilitários e estado primeiro, app.js por último. -->
  <script src="js/utilitarios.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/desenho.js"></script>
  <script src="js/circulos.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/sugestoes.js"></script>
  <script src="js/captura.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/lixeira.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
